name: chess_app
description: A-CHESS shaxmat ilovasi (kompyuter va Android)
publish_to: none
version: 0.12.0+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  chess: ^0.8.1
  flutter_svg: ^2.0.10+1
  file_picker: ^10.3.0
  stockfish_chess_engine: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
