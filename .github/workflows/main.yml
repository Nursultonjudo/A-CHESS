name: Build app

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server manzili (masalan https://shaxmat.example.uz)"
        required: true
        default: "http://localhost:3000"

env:
  API_URL: ${{ github.event.inputs.api_url || 'http://localhost:3000' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fayllarni to'g'ri papkalarga joylash
        shell: bash
        run: |
          mv_if() { if [ -f "$1" ]; then mkdir -p "$2"; mv "$1" "$2/"; fi; }
          mv_if pubspec.yaml app
          mv_if icon.png app/assets
          for f in home_screen otp_screen register_screen; do mv_if $f.dart app/lib/screens; done
          mv_if chess_board.dart app/lib/widgets
          for f in *.dart; do mv_if "$f" app/lib; done
          find app -type f
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android loyiha papkasini yaratish
        working-directory: app
        run: flutter create --platforms=android --project-name chess_app --org uz.shaxmat .
      - name: Internet ruxsatini va nomini qo'shish
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="chess_app"#android:label="A-CHESS"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
        working-directory: app
      - name: Ikonka o'rnatish
        working-directory: app
        run: |
          printf 'flutter_launcher_icons:\n  image_path: "assets/icon.png"\n  android: "launcher_icon"\n  ios: false\n  min_sdk_android: 21\n' > icons.yaml
          dart run flutter_launcher_icons -f icons.yaml
      - name: NDK ni oldindan o'rnatish (qayta urinish bilan)
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ok=0
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            if yes | "$SDKM" --install "ndk;28.2.13676358"; then ok=1; break; fi
            echo "NDK o'rnatish $i-urinish muvaffaqiyatsiz, qayta uriniladi"
            sleep 15
          done
          [ "$ok" = 1 ] || echo "NDK oldindan o'rnatilmadi, Gradle o'zi urinib ko'radi"
      - name: APK yig'ish
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter build apk --release --dart-define=API_URL=${{ env.API_URL }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Android: xato qatorlari'
              echo '```'
              grep -n -i -B1 -A3 -E "error:|FAILURE|went wrong" build.log | head -60
              echo '```'
              echo '### Android: logning oxirgi 25 qatori'
              echo '```'
              tail -n 25 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: shaxmat-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fayllarni to'g'ri papkalarga joylash
        shell: bash
        run: |
          mv_if() { if [ -f "$1" ]; then mkdir -p "$2"; mv "$1" "$2/"; fi; }
          mv_if pubspec.yaml app
          mv_if icon.png app/assets
          for f in home_screen otp_screen register_screen; do mv_if $f.dart app/lib/screens; done
          mv_if chess_board.dart app/lib/widgets
          for f in *.dart; do mv_if "$f" app/lib; done
          find app -type f
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Windows loyiha papkasini yaratish
        working-directory: app
        run: flutter create --platforms=windows --project-name chess_app --org uz.shaxmat .
      - name: Oyna nomini o'zgartirish
        working-directory: app
        shell: bash
        run: |
          sed -i 's#L"chess_app"#L"A-CHESS"#' windows/runner/main.cpp
      - run: flutter pub get
        working-directory: app
      - name: Ikonka o'rnatish
        working-directory: app
        run: |
          printf 'flutter_launcher_icons:\n  image_path: "assets/icon.png"\n  android: false\n  ios: false\n  windows:\n    generate: true\n    image_path: "assets/icon.png"\n    icon_size: 256\n' > icons.yaml
          dart run flutter_launcher_icons -f icons.yaml
      - name: Windows dasturini yig'ish
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter build windows --release --dart-define=API_URL=${{ env.API_URL }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Windows: xato qatorlari'
              echo '```'
              grep -n -i -B1 -A3 -E "error:|FAILURE|went wrong" build.log | head -60
              echo '```'
              echo '### Windows: logning oxirgi 25 qatori'
              echo '```'
              tail -n 25 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: shaxmat-windows
          path: app/build/windows/x64/runner/Release
