name: Build app

# Repozitoriyani GitHub'ga yuklang, Actions bo'limida "Build app" ni ishga tushiring
# (yoki main'ga push qiling). Tayyor APK va Windows dasturi "Artifacts" bo'limida bo'ladi.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server manzili (masalan https://shaxmat.example.uz)"
        required: true
        default: "http://localhost:3000"
  push:
    branches: [main]

env:
  API_URL: ${{ github.event.inputs.api_url || 'http://localhost:3000' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android loyiha papkasini yaratish
        working-directory: app
        run: flutter create --platforms=android --project-name chess_app --org uz.shaxmat .
      - name: Internet ruxsatini qo'shish
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Oddiy http serverga ulanish uchun (test); https serverda kerak emas
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: shaxmat-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Windows loyiha papkasini yaratish
        working-directory: app
        run: flutter create --platforms=windows --project-name chess_app --org uz.shaxmat .
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: shaxmat-windows
          path: app/build/windows/x64/runner/Release
